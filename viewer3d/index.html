<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Viewer</title>
    <!-- Light scene background before the app (and its CSS) loads -->
    <style>
      html,
      body {
        background-color: #eef0f4;
      }

      /* ── Splash screen (removed by App on mount) ─────────────────── */

      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: #eef0f4;
        font-family: "Noto Sans", "Oxygen", "Ubuntu", "DejaVu Sans", sans-serif;
        transition: opacity 0.25s ease;
      }

      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }

      .splash-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .splash-title {
        margin: 0;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.5px;
        /* gradient in the logo's face colors */
        background: linear-gradient(100deg, #36c2f8 0%, #8e38c9 100%);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      .splash-spinner {
        width: 36px;
        height: 36px;
        margin-top: 12px;
        border: 4px solid transparent;
        /* four spinner segments in the logo's face colors */
        border-top-color: #36c2f8;
        border-right-color: #8e38c9;
        border-bottom-color: #18a9f0;
        border-left-color: #b05ce6;
        border-radius: 50%;
        animation: splash-spin 0.9s linear infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Static splash: visible until the Preact app takes over -->
    <div id="splash">
      <div class="splash-row">
        <!-- App icon (copy of src-tauri/icons/icon.svg, served from public/) -->
        <img src="/app-icon.svg" alt="" width="72" height="72" />
        <h1 class="splash-title">3D Viewer</h1>
      </div>
      <div class="splash-spinner"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
